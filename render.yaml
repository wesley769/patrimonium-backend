services:
  - type: web
    name: patrimonium-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: DATABASE_URL
        sync: false          # preencha no painel do Render
      - key: JWT_SECRET
        generateValue: true  # gerado automaticamente
      - key: JWT_EXP_H
        value: 8
